<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <main class="admin-container">
        <div class="admin-box">
            <h1>Admin Portal</h1>
            <section class="upload-section">
                <h2>Upload Blog Post</h2>
                <input type="text" id="blog-title" placeholder="Blog Title">
                <textarea id="blog-content" placeholder="Write your blog content here..."></textarea>
                <input type="file" id="blog-image">
                <button onclick="uploadBlogPost()">Upload Blog Post</button>
            </section>
            <section class="remove-section">
                <h2>Remove Blog Post</h2>
                <select id="blog-select"></select>
                <button onclick="removeBlogPost()">Remove Blog Post</button>
            </section>
        </div>
    </main>
    <script src="upload.js"></script>
    <script src="auth.js"></script>
</body>
</html>
